<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaiwi Coast: Volunteer Events</title>
<meta name="description" content="Upcoming volunteer events from every group caring for the Kaiwi Coast on Oʻahu. Find an event and sign up.">
<style>
:root{--bg:#eef4f3;--surface:#fff;--ink:#16282c;--muted:#51666b;--line:#cddcdb;--sea:#0e6b73;--sea-d:#0a4a50;--gold:#e0a526}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font:700 clamp(2.4rem,7vw,4.2rem)/1.1 Georgia,"Iowan Old Style","Times New Roman",serif;letter-spacing:-.02em;margin:0 0 .3em}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:40px 0 28px}
header p{margin:0;color:var(--muted);max-width:56ch}
main{padding:28px 0 48px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.filters,.views{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 14px;font:500 .9rem system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:#fff}
.sw{width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 2px #fff}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;overflow:hidden}
iframe{width:100%;height:680px;border:0;display:block}
.setup{padding:24px;color:var(--muted)}
.setup code{background:var(--bg);padding:2px 6px;border-radius:4px}
.hint{color:var(--muted);font-size:.92rem;margin:12px 0 0}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:.9rem}
@media (max-width:700px){iframe{height:600px}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Kaiwi Coast</h1>
  <p>Volunteer events from every group caring for the coast. Click an event to see details and sign up.</p>
</div></header>

<main><div class="wrap">
  <div class="bar">
    <div class="filters" id="filters" role="group" aria-label="Filter by organization"></div>
    <div class="views" id="views" role="group" aria-label="Calendar view">
      <button class="chip" data-v="MONTH" aria-pressed="true">Month</button>
      <button class="chip" data-v="AGENDA" aria-pressed="false">List</button>
    </div>
  </div>
  <div class="panel" id="panel"></div>
  <p class="hint">Times are Hawaiʻi time. To sign up, click an event and follow the link in its description.</p>
</div></main>

<footer><div class="wrap">Kaiwi Coast volunteer calendar.</div></footer>

<script>
/* ===== ONE-TIME SETUP: edit only this list =====
   Add one line per organization. "id" is the Google Calendar ID
   (Google Calendar > Settings for that calendar > Integrate calendar > Calendar ID).
   After this, events are managed entirely in Google Calendar.
   The current ID's used are test calendars from gmail account joseph.dangelo717@gmail.com */
var CALENDARS = [
  { name: "Livable Maunalua Hui",   id: "60a4415d4fd7fe7efa84d84ea57d61aa93277182e5522585b045aec158b15643@group.calendar.google.com", color: "#0E6B73" },
  { name: "Partner Organization 2", id: "ec7e635ad663f595f928a783704faefe53e35560e55b52c4d94e0fbb2ae500f9@group.calendar.google.com", color: "#7A4FA3" },
  { name: "Partner Organization 3", id: "", color: "#B3541E" }
];
/* ===== end of setup ===== */

var TZ = "Pacific/Honolulu";
var active = CALENDARS.filter(function (c) { return c.id; });
var filt = "all";
var mode = window.innerWidth < 700 ? "AGENDA" : "MONTH";

function embedURL() {
  var list = filt === "all" ? active : active.filter(function (c) { return c.id === filt; });
  var u = "https://calendar.google.com/calendar/embed?ctz=" + encodeURIComponent(TZ) +
    "&mode=" + mode + "&showTitle=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0&wkst=1&bgcolor=%23ffffff";
  list.forEach(function (c) {
    u += "&src=" + encodeURIComponent(c.id) + "&color=" + encodeURIComponent(c.color);
  });
  return u;
}

function renderFilters() {
  var h = '<button class="chip" data-f="all" aria-pressed="' + (filt === "all") + '">All organizations</button>';
  active.forEach(function (c) {
    h += '<button class="chip" data-f="' + c.id + '" aria-pressed="' + (filt === c.id) +
      '"><span class="sw" style="background:' + c.color + '"></span>' + c.name + '</button>';
  });
  document.getElementById("filters").innerHTML = active.length ? h : "";
}

function renderViews() {
  document.querySelectorAll("#views .chip").forEach(function (b) {
    b.setAttribute("aria-pressed", String(b.dataset.v === mode));
  });
}

function renderCal() {
  var p = document.getElementById("panel");
  if (!active.length) {
    p.innerHTML = '<div class="setup"><strong>Calendar not connected yet.</strong><br>Open <code>index.html</code>, find the <code>CALENDARS</code> list near the bottom, and paste in each organization’s Google Calendar ID.</div>';
    return;
  }
  p.innerHTML = '<iframe title="Kaiwi Coast volunteer events calendar" src="' + embedURL() + '" loading="lazy"></iframe>';
}

document.addEventListener("click", function (e) {
  var t = e.target.closest(".chip");
  if (!t) return;
  if (t.dataset.f) { filt = t.dataset.f; renderFilters(); renderCal(); }
  if (t.dataset.v) { mode = t.dataset.v; renderViews(); renderCal(); }
});

renderFilters(); renderViews(); renderCal();
</script>
</body>
</html>
